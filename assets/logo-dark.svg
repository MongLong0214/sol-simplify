<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 124" width="720" height="124" role="img" aria-labelledby="ss-t ss-d">
  <title id="ss-t">sol-simplify</title>
  <desc id="ss-d">A tangled red line draws itself, then straightens into a single clean line that keeps flowing, next to the wordmark sol-simplify.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* 한 사이클(7s): 매듭이 그려지고(0-38%) → 직선이 뻗고(38-52%) → 점이 찍히고 → 흐름 유지 → 리셋 */
    @keyframes ss-tangle {
      0%       { stroke-dashoffset: 100 }
      38%, 96% { stroke-dashoffset: 0 }
      100%     { stroke-dashoffset: 100 }
    }
    @keyframes ss-line {
      0%, 36%  { stroke-dashoffset: 100 }
      52%, 96% { stroke-dashoffset: 0 }
      100%     { stroke-dashoffset: 100 }
    }
    @keyframes ss-dot {
      0%, 50%  { opacity: 0; transform: scale(0.4) }
      56%, 94% { opacity: 1; transform: scale(1) }
      100%     { opacity: 0; transform: scale(0.4) }
    }
    @keyframes ss-flow { to { stroke-dashoffset: -44 } }

    .ss-tangle { stroke-dasharray: 100; animation: ss-tangle 7s ease-in-out infinite }
    .ss-line   { stroke-dasharray: 100; animation: ss-line   7s ease-in-out infinite }
    .ss-dot    { animation: ss-dot 7s ease-in-out infinite;
                  transform-box: fill-box; transform-origin: center }
    .ss-flow   { animation: ss-flow 2.2s linear infinite }

    @media (prefers-reduced-motion: reduce) {
      .ss-tangle, .ss-line { animation: none !important; stroke-dashoffset: 0 }
      .ss-dot  { animation: none !important; opacity: 1; transform: scale(1) }
      .ss-flow { animation: none !important; opacity: 0 }
    }
  </style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="ss-tangle" pathLength="100" d="M 20 70 C 34 24, 84 12, 100 40 C 112 62, 82 86, 62 74 C 40 60, 58 30, 92 30 C 120 30, 130 52, 116 66 C 102 80, 82 72, 88 54 C 94 36, 128 34, 146 48 C 160 58, 158 62, 174 62" stroke="#e05d52" stroke-width="8.5" opacity="0.96"/>
    <path class="ss-line" pathLength="100" d="M 174 62 H 262" stroke="#ededed" stroke-width="8.5"/>
    <path class="ss-flow" pathLength="100" d="M 174 62 H 262" stroke="#ededed" stroke-width="9" stroke-dasharray="14 30" opacity="0.45"/>
    <circle class="ss-dot" cx="262" cy="62" r="6" fill="#ededed"/>
  </g>
  <text x="304" y="78" fill="#ededed" font-size="46" font-weight="650" letter-spacing="0.5">sol-<tspan fill="#e05d52">simplify</tspan></text>
</svg>