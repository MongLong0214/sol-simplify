<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Verification machinery vs product source, 20 days</title>
  <desc id="hero-d">Line chart from the audited repository's git history. The verification machinery line leads the product line for all 20 days, reaching 13,090 lines by day 6 while the product has 3,561. On day 17 the agent's own rule blocks all work. Final: machinery 20,280 lines, product 17,964.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @keyframes dash { to { stroke-dashoffset: -40 } }
    .flow { animation: dash 2.4s linear infinite }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0 } }
  </style>
  <rect width="960" height="380" rx="18" fill="#141414"/>
  <text x="78" y="30" fill="#ededed" font-size="17" font-weight="600">The machinery led the product for all 20 days</text>
  <text x="78" y="50" fill="#9a9994" font-size="12.5">Lines of code by date, measured from the audited repository&#8217;s full git history</text>
  <line x1="78" y1="269.7" x2="650" y2="269.7" stroke="#2c2c2b" stroke-width="1"/>
  <text x="68" y="273.7" fill="#9a9994" font-size="11.5" text-anchor="end">5k</text>
  <line x1="78" y1="205.4" x2="650" y2="205.4" stroke="#2c2c2b" stroke-width="1"/>
  <text x="68" y="209.4" fill="#9a9994" font-size="11.5" text-anchor="end">10k</text>
  <line x1="78" y1="141.1" x2="650" y2="141.1" stroke="#2c2c2b" stroke-width="1"/>
  <text x="68" y="145.1" fill="#9a9994" font-size="11.5" text-anchor="end">15k</text>
  <line x1="78" y1="76.9" x2="650" y2="76.9" stroke="#2c2c2b" stroke-width="1"/>
  <text x="68" y="80.9" fill="#9a9994" font-size="11.5" text-anchor="end">20k</text>
  <line x1="78" y1="334.0" x2="650" y2="334.0" stroke="#9a9994" stroke-width="1" opacity="0.55"/>
  <text x="78.0" y="362" fill="#9a9994" font-size="11.5" text-anchor="middle">Aug 5</text>
  <text x="228.5" y="362" fill="#9a9994" font-size="11.5" text-anchor="middle">Aug 10</text>
  <text x="379.1" y="362" fill="#9a9994" font-size="11.5" text-anchor="middle">Aug 15</text>
  <text x="529.6" y="362" fill="#9a9994" font-size="11.5" text-anchor="middle">Aug 20</text>
  <text x="650.0" y="362" fill="#9a9994" font-size="11.5" text-anchor="middle">Aug 24</text>
  <line x1="589.8" y1="72" x2="589.8" y2="334.0" stroke="#9a9994" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <text x="600" y="210" fill="#ededed" font-size="12" font-weight="600">day 17</text>
  <text x="600" y="226" fill="#9a9994" font-size="11.5">its own rule refuses all work &#8212;</text>
  <text x="600" y="241" fill="#9a9994" font-size="11.5">4 implementation lanes blocked</text>
  <path d="M 78.0 334.0 L 108.1 334.0 L 228.5 288.2 L 499.5 275.9 L 514.5 234.8 L 559.7 185.8 L 589.8 169.7 L 619.9 103.0 L 650.0 103.0" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 78.0 334.0 L 108.1 294.8 L 228.5 165.7 L 499.5 143.0 L 514.5 131.7 L 559.7 113.3 L 589.8 108.2 L 619.9 100.5 L 650.0 73.3" fill="none" stroke="#e05d52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="flow" d="M 78.0 334.0 L 108.1 294.8 L 228.5 165.7 L 499.5 143.0 L 514.5 131.7 L 559.7 113.3 L 589.8 108.2 L 619.9 100.5 L 650.0 73.3" fill="none" stroke="#e05d52" stroke-width="3.5" stroke-dasharray="12 28" stroke-linecap="round" opacity="0.9"/>
  <circle cx="228.5" cy="165.7" r="4.5" fill="#e05d52" stroke="#141414" stroke-width="2"/>
  <text x="240.5" y="189.7" fill="#ededed" font-size="12">13,090 lines of machinery by day 6</text>
  <text x="240.5" y="205.7" fill="#9a9994" font-size="11.5">&#8212; the product barely exists</text>
  <circle cx="650.0" cy="73.3" r="4.5" fill="#e05d52" stroke="#141414" stroke-width="2"/>
  <circle cx="650.0" cy="103.0" r="4.5" fill="#3987e5" stroke="#141414" stroke-width="2"/>
  <text x="664.0" y="74.3" fill="#e05d52" font-size="12.5" font-weight="600">machinery <tspan fill="#ededed" font-weight="400">20,280</tspan></text>
  <text x="664.0" y="119.0" fill="#3987e5" font-size="12.5" font-weight="600">product <tspan fill="#ededed" font-weight="400">17,964</tspan></text>
</svg>
